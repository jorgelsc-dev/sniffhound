name: Package Debian

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deb-package:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Build Debian package
        run: ./scripts/build_deb.sh

      - name: Show package metadata
        run: dpkg-deb --info dist/*.deb

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniffhound-deb-${{ github.run_number }}.${{ github.run_attempt }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 30
